        plugin_kind:
          $ref: '#/components/schemas/PlatformPluginKind'
    PlatformSyncDestinationWriteModeUpdate:
      type: string
      description: Write mode for the destination, for updating
      enum:
      - append
      - overwrite
      - overwrite-delete-stale
    PlatformSyncDestinationUpdate:
      title: Sync Destination definition for updating a destination
