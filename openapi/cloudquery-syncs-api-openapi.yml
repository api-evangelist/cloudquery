      type: object
      properties:
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        write_mode:
          $ref: '#/components/schemas/PlatformSyncDestinationWriteModeUpdate'
        migrate_mode:
          $ref: '#/components/schemas/PlatformSyncDestinationMigrateModeUpdate'
