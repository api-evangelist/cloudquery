        status:
          $ref: '#/components/schemas/PlatformSyncTestConnectionStatus'
          description: Status of the sync test connection
        failure_reason:
          type: string
          description: Reason for failure
          example: password authentication failed for user "exampleuser"
        failure_code:
          example: INVALID_CREDENTIALS
          type: string
          description: Code for failure
        created_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
          description: Time the test connection was created
        completed_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
          description: Time the test connection was completed
        plugin_path:
          $ref: '#/components/schemas/PlatformSyncPluginPath'
