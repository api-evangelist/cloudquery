components:
  schemas:
    PlatformPluginKind:
      description: The kind of plugin, ie. source or destination.
      type: string
      example: source
      enum:
      - source
      - destination
      - transformer
    PlatformSyncDestination:
      allOf:
      - $ref: '#/components/schemas/PlatformSyncDestinationCreate'
      - type: object
        required:
        - name
        - display_name
        - path
        - version
        - write_mode
        - migrate_mode
        - spec
        - env
        - created_at
        - updated_at
        - last_update_source
        - draft
        - transformers
        properties:
          created_at:
            type: string
            format: date-time
            example: '2023-07-14T16:53:42Z'
            description: Time when the source was created
          updated_at:
            type: string
            format: date-time
            example: '2023-07-14T16:53:42Z'
            description: Time when the source was last updated
          env:
            description: Environment variables for the plugin.
            type: array
            items:
              $ref: '#/components/schemas/PlatformSyncEnv'
          draft:
            type: boolean
            description: If a sync destination is in draft, it cannot be used in syncs. To get it out of draft, 'promote' it using a successful test connection ID.
          previous_version:
            type: string
            description: Previous version of the plugin during a version upgrade
            example: v1.2.2
    PlatformSyncIntegrationSourceUpdateV2:
      description: Integration Definition
      type: object
      properties:
        test_connection_id:
          type: string
          format: uuid
          example: 12345678-1234-1234-1234-1234567890ab
          description: unique ID of the test connection
          x-go-name: TestConnectionID
        tables:
          type: array
          description: Tables to sync. Wildcards are supported. Note that child tables are excluded by default, and need to be explicitly specified.
          items:
            type: string
        skip_tables:
          type: array
          description: Tables matched by `tables` that should be skipped. Wildcards are supported.
          items:
            type: string
        last_update_source:
          $ref: '#/components/schemas/PlatformSyncLastUpdateSource'
    PlatformSyncEnv:
      type: object
      description: Environment variable. Environment variables are assumed to be secret.
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the environment variable
    PlatformPluginTier:
      description: "This field is deprecated, refer to `price_category` instead.\nThis field is only kept for backward compatibility and may be removed in a future release.\nSupported tiers for plugins.\n  - free: Free tier, with no paid tables.\n  - paid: Paid tier. These plugins may have paid tables, but can also have free tables. They require login to access.\n  - open-core: This option is deprecated, values will either be free or paid.\n"
      type: string
      deprecated: true
      enum:
      - free
      - paid
      - open-core
    PlatformSyncSortDirection:
      title: SyncSortDirection
      type: string
      enum:
      - asc
      - desc
      default: asc
    PlatformOnboardingID:
      description: ID of the cloud provider onboarding session
      type: string
      format: uuid
      example: 12345678-1234-1234-1234-1234567890ab
      x-go-name: OnboardingID
    PlatformSyncDestinationName:
      type: string
      example: my-destination-definition
      description: Descriptive, unique name for the destination
      pattern: ^[a-zA-Z0-9_-]+$
      x-pattern-message: can contain only alphanumerical characters, dashes, and underscores
      x-go-name: SyncDestinationNameField
    PlatformSyncTestConnectionID:
      type: string
      format: uuid
      example: 12345678-1234-1234-1234-1234567890ab
      description: unique ID of the test connection
      x-go-name: ID
    PlatformSyncRunTableStat:
      type: object
      required:
      - service_name
      - name
      - started_at
      properties:
        service_name:
          type: string
          description: Name of the service
          example: aws
        name:
          type: string
          description: Name of the table
          example: aws_ec2_instances
        started_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
          description: Time the table sync was started
        completed_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
          description: Time the table sync was completed
        resources:
          type: integer
          format: uint64
          description: Number of resources fetched
        errors:
          type: integer
          format: uint64
          description: Number of errors encountered
        panics:
          type: integer
          format: uint64
          description: Number of panics encountered
        runtime_seconds:
          type: integer
          format: int64
          description: Number of seconds it took to sync a table
    PlatformSyncSourceUpdate:
      title: Sync Source definition for updating a source
      description: Sync Source Update Definition
      type: object
      properties:
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        tables:
          type: array
          description: Tables to sync. Wildcards are supported. Note that child tables are excluded by default, and need to be explicitly specified.
          items:
            type: string
        skip_tables:
          type: array
          description: Tables matched by `tables` that should be skipped. Wildcards are supported.
          items:
            type: string
        last_update_source:
          $ref: '#/components/schemas/PlatformSyncLastUpdateSource'
        destination_names:
          type: array
          description: List of sync destination names associated with this source
          items:
            $ref: '#/components/schemas/PlatformSyncDestinationName'
          minItems: 0
          default:
          - cloudquery
    PlatformSyncDestinationCreate:
      title: Sync Destination definition for creating a new destination
      description: Sync Destination Definition
      type: object
      required:
      - name
      - path
      - version
      properties:
        name:
          type: string
          example: my-destination-definition
          description: Descriptive, unique name for the destination
          pattern: ^[a-zA-Z0-9_-]+$
          x-pattern-message: can contain only alphanumerical characters, dashes, and underscores
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        path:
          $ref: '#/components/schemas/PlatformSyncPluginPath'
          example: cloudquery/postgresql
        version:
          type: string
          description: Version of the plugin
          example: v1.2.3
        write_mode:
          $ref: '#/components/schemas/PlatformSyncDestinationWriteMode'
        migrate_mode:
          $ref: '#/components/schemas/PlatformSyncDestinationMigrateMode'
        sync_group_id:
          type: string
          x-go-name: SyncGroupID
        send_sync_summary:
          type: boolean
        spec:
          type: object
          additionalProperties: true
          format: Plugin parameters, specific to each plugin
        env:
          description: Environment variables for the plugin. All environment variables will be stored as secrets.
          type: array
          items:
            $ref: '#/components/schemas/PlatformSyncEnvCreate'
        last_update_source:
          $ref: '#/components/schemas/PlatformSyncLastUpdateSource'
        transformers:
          type: array
          items:
            type: string
            description: Unique name of the transformer
            pattern: ^[a-zA-Z0-9_-]+$
            x-pattern-message: can contain only alphanumerical characters, dashes, and underscores
    PlatformPluginPriceCategory:
      description: Supported price categories for billing
      type: string
      enum:
      - api
      - database
      - free
    PlatformSyncRunWorkerStatus:
      description: The worker information for a sync run
      type: object
      required:
      - phase
      properties:
        phase:
          $ref: '#/components/schemas/PlatformSyncRunWorkerPhase'
          description: Phase that the worker is in
        reason:
          type: string
          description: The reason for the status of the worker
    PlatformSyncTransformerCreate:
      title: Sync Transformer definition for creating a new transformer
      description: Sync Transformer Definition
      type: object
      required:
      - name
      - path
      - version
      - tables
      properties:
        name:
          type: string
          example: my-transformer-definition
          description: Descriptive, unique name for the transformer
          pattern: ^[a-zA-Z0-9_-]+$
          x-pattern-message: can contain only alphanumerical characters, dashes, and underscores
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        path:
          $ref: '#/components/schemas/PlatformSyncPluginPath'
          example: cloudquery/basic
        version:
          type: string
          description: Version of the plugin
          example: v1.2.3
        spec:
          type: object
          additionalProperties: true
          format: Plugin parameters, specific to each plugin
        env:
          description: Environment variables for the plugin. All environment variables will be stored as secrets.
          type: array
          items:
            $ref: '#/components/schemas/PlatformSyncEnvCreate'
        last_update_source:
          $ref: '#/components/schemas/PlatformSyncLastUpdateSource'
    PlatformSyncGenericSortBy:
      title: SyncGenericSortBy
      type: string
      enum:
      - name
      - display_name
      - path
      - version
      - created_at
      - updated_at
      - draft
    PlatformSyncTestConnection:
      type: object
