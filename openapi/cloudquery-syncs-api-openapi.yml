      - $ref: '#/components/schemas/PlatformSync'
      - type: object
        properties:
          last_run:
            $ref: '#/components/schemas/PlatformListSyncLastRun'
    PlatformSyncSourceTestConnection:
      type: object
      required:
      - id
      - created_at
      - status
      properties:
        id:
          $ref: '#/components/schemas/PlatformSyncTestConnectionID'
          x-go-name: ID
        status:
          $ref: '#/components/schemas/PlatformSyncTestConnectionStatus'
          description: Status of the sync test connection
        failure_reason:
          type: string
          description: Reason for failure
