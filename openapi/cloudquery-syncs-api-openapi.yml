      type: object
      required:
      - created_at
      - sync_name
      - id
      - status
      - total_rows
      - warnings
      - errors
      - migrate
      - ingested
      properties:
        sync_name:
          type: string
          description: Name of the sync
        id:
          type: string
          format: uuid
          example: 12345678-1234-1234-1234-1234567890ab
          description: unique ID of the run
          x-go-name: ID
        status:
          $ref: '#/components/schemas/PlatformSyncRunStatus'
          description: Status of the sync run
