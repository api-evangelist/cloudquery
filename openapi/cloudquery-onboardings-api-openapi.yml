        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationsRequest'
      responses:
        '201':
          description: Integrations created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationsResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform create AWS unified integrations
      x-summary-source: derived
  /onboardings/gcp/wif:
    post:
      operationId: PlatformCreateGCPWIFOnboarding
      description: Create a keyless GCP onboarding based on workload identity federation and return the gcloud setup script to run in the target GCP project.
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingGCPWIFCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingGCPWIFCreateResponse'
          description: Created
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform create GCPWIF onboarding
      x-summary-source: derived
  /onboardings/gcp/wif/{onboarding_id}:
    get:
      operationId: PlatformGetGCPWIFOnboarding
      description: Query a GCP workload identity federation onboarding
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingGCPWIF'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform get GCPWIF onboarding
      x-summary-source: derived
  /onboardings/gcp/wif/{onboarding_id}/complete:
    post:
      operationId: PlatformCompleteGCPWIFOnboarding
      description: Complete a GCP workload identity federation onboarding by submitting the identifiers created by the setup script. The platform exchanges a tenant-scoped token through the referenced workload identity provider, reads back the provider attribute condition and the service account IAM policy, and refuses to complete the onboarding unless both are pinned to exactly the CloudQuery tenant subject.
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingGCPWIFCompleteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingGCPWIF'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '409':
          $ref: '#/components/responses/PlatformConflict'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform complete GCPWIF onboarding
      x-summary-source: derived
  /onboardings/gcp/wif/{onboarding_id}/verify-billing-export:
    post:
      operationId: PlatformVerifyGCPWIFBillingExport
      description: Verify that a BigQuery dataset holds a Cloud Billing detailed usage cost export the completed onboarding's service account can read. The platform lists the dataset's tables through the onboarding's workload identity federation credentials and resolves the detailed export, so a dataset holding only the standard export is rejected at setup instead of syncing rows CloudQuery cannot attribute to any asset.
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingGCPBillingExportRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingGCPBillingExportResponse'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform verify GCPWIF billing export
      x-summary-source: derived
  /onboardings/azure/wif:
    post:
      operationId: PlatformCreateAzureWIFOnboarding
      description: Create a keyless Azure onboarding based on workload identity federation and return the az CLI setup script to run against the target Azure tenant.
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingAzureWIFCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAzureWIFCreateResponse'
          description: Created
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform create azure WIF onboarding
      x-summary-source: derived
  /onboardings/azure/wif/{onboarding_id}:
    get:
      operationId: PlatformGetAzureWIFOnboarding
      description: Query an Azure workload identity federation onboarding
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAzureWIF'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform get azure WIF onboarding
      x-summary-source: derived
  /onboardings/azure/wif/{onboarding_id}/complete:
    post:
      operationId: PlatformCompleteAzureWIFOnboarding
      description: Complete an Azure workload identity federation onboarding by submitting the identifiers created by the setup script. Entra ID enforces an exact match on the federated credential's issuer, subject and audience, so the token exchange during the connection test is the verification; no identifiers are validated against Azure here.
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingAzureWIFCompleteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAzureWIF'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '409':
          $ref: '#/components/responses/PlatformConflict'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform complete azure WIF onboarding
      x-summary-source: derived
  /onboardings/azure/wif/{onboarding_id}/verify-cost-export:
    post:
      operationId: PlatformVerifyAzureWIFCostExport
      description: Verify that a Cost Management FOCUS export is readable end to end by the completed onboarding's identity, and record it on the onboarding. The platform reads the export definition, resolves the storage destination from the export's own delivery settings and lists the blobs already delivered under it, so the storage account, container and prefix are never taken from the request. A FOCUS export whose destination subscription has not registered Microsoft.CostManagementExports is accepted by Azure and then delivers nothing; that case is reported separately from a missing Storage Blob Data Reader assignment, which fails the blob listing outright.
      parameters:
      - $ref: '#/components/parameters/platform_onboarding_id'
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformOnboardingAzureCostExportRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAzureCostExportResponse'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform verify azure WIF cost export
      x-summary-source: derived
  /aws/unified/test-connections:
    post:
      operationId: PlatformCreateAWSUnifiedTestConnectionsStandalone
      description: Create test connections for AWS unified features without an onboarding. Frontend is expected to provide a per-feature plugin spec (with ${ENV_VAR} placeholders for sensitive values like external_id) plus an env list containing the corresponding values.
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAWSUnifiedTestConnectionsRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedTestConnectionsResponse'
          description: Created
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform create AWS unified test connections standalone
      x-summary-source: derived
  /aws/unified/integrations:
    post:
      operationId: PlatformCreateAWSUnifiedIntegrationsStandalone
      description: 'Create AWS unified integrations from previously created standalone test connections (no onboarding). Like the onboarding-bound counterpart, this endpoint may create multiple syncs from a single request: asset_inventory creates a main sync plus a CloudTrail companion sync, additional_metadata creates a metadata sync, and cost_and_usage creates a CUR sync.'
      tags:
      - Onboardings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAWSUnifiedIntegrationsRequest'
      responses:
        '201':
          description: Integrations created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationsResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform create AWS unified integrations standalone
      x-summary-source: derived
  /aws/unified/standalone-template:
    get:
      operationId: PlatformGetAWSUnifiedStandaloneTemplate
      description: Return the URL of the CloudFormation template used to provision the cross-account read-only role (and, when enabled, the Cost & Usage export) for the manual/standalone AWS unified flow, without creating an onboarding. The deployed stack's outputs (role ARN and, when enabled, CUR report name), plus the ExternalId parameter value, are submitted to the standalone test-connections endpoint.
      tags:
      - Onboardings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAWSUnifiedStandaloneTemplateResponse'
          description: OK
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform get AWS unified standalone template
      x-summary-source: derived
  /aws/organization/discover:
    post:
      operationId: PlatformDiscoverAWSOrganization
      description: List the OU tree and the accounts of an AWS Organization. The scheduler assumes the tenant sync role, then the given management account role with the External ID. The response body is the Root OU.
      tags:
      - Onboardings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAWSOrganizationDiscoverRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAWSOrganizationUnit'
          description: OK
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      summary: Platform discover AWS organization
      x-summary-source: derived
components:
  schemas:
    PlatformAWSUnifiedFeatureTestConnectionConfig:
      type: object
      description: Per-feature plugin spec and environment variables for a standalone AWS unified test connection. The spec may contain ${ENV_VAR} placeholders that resolve from the env list at sync time.
      required:
      - spec
      additionalProperties: false
      properties:
        spec:
          type: object
          additionalProperties: true
          description: Plugin spec (regions, accounts, etc.). May reference env vars via ${VAR}.
        env:
          type: array
          description: Environment variables for the plugin. All values are stored as encrypted secrets and substituted into the spec at sync time.
          items:
            $ref: '#/components/schemas/PlatformSyncEnvCreate'
    PlatformSyncEnvCreate:
      type: object
      description: Environment variable. Environment variables are assumed to be secret.
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the environment variable
        value:
          type: string
          description: Value of the environment variable
    PlatformOnboardingAWSUnifiedIntegrationsRequest:
      type: object
      description: Request to create integrations for all enabled features
      additionalProperties: false
      required:
      - destination_names
      properties:
        name:
          type: string
          description: Base name for the integrations. Sub-integrations derive their names from this value. When omitted, the server derives it from display_name (or the plugin name) and adds a numeric suffix if needed so every sub-integration name is unique.
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        destination_names:
          type: array
          items:
            type: string
        schedule:
          type: string
          description: Cron schedule for every created sync. A feature block's own schedule overrides it for that feature.
        asset_inventory:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
        cost_and_usage:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
        additional_metadata:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
    PlatformOnboardingAWSCURCreateResponse:
      type: object
      description: AWS CUR onboarding create response
      additionalProperties: false
      required:
      - id
      - region
      - issuer_url
      - audience
      - subject
      - template_url
      - notify_path
      - notify_token
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        region:
          type: string
          description: AWS region where the CUR stack must be deployed. Always 'us-east-1' because AWS Cost and Usage Reports are only available in that region.
        stack_name:
          type: string
          description: Stack name that should be used
          maxLength: 128
        issuer_url:
          type: string
          description: URL of the OpenID server to use when setting up a trust relationship
          x-go-name: IssuerURL
        audience:
          type: string
          description: OpenID audience claim for the trust relationship
          x-go-name: Audience
        subject:
          type: string
          description: OpenID subject claim for the trust relationship
          x-go-name: Subject
        notify_path:
          type: string
          description: Path of the notify endpoint to use for status updates
          x-go-name: NotifyPath
        template_url:
          type: string
          description: URL of the CloudFormation template to use for the CUR setup
          x-go-name: TemplateURL
        notify_token:
          type: string
          description: An authentication token that should be used for notifications
    PlatformOnboardingGCPBillingExportResponse:
      type: object
      description: The verified detailed usage cost export CloudQuery will read
      additionalProperties: false
      required:
      - table
      properties:
        table:
          type: string
          description: The detailed usage cost export table resolved in the dataset, without the project or dataset qualifier.
          x-go-name: Table
    PlatformStartedNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        properties:
          status:
            enum:
            - started
    PlatformAWSUnifiedStandaloneTemplateResponse:
      type: object
      description: CloudFormation template for the self-service (no-onboarding) AWS unified setup. The user deploys it themselves and submits the resulting role ARN and, when enabled, CUR report name, along with the ExternalId parameter value, to the standalone test-connections endpoint.
      additionalProperties: false
      required:
      - template_url
      properties:
        template_url:
          type: string
          description: URL of the CloudFormation template that creates the cross-account read-only role (and, when enabled, the Cost & Usage export) for the manual/standalone AWS unified flow.
    PlatformOnboardingAWSUnifiedNotification:
      oneOf:
      - $ref: '#/components/schemas/PlatformStartedNotification'
      - $ref: '#/components/schemas/PlatformRevokedNotification'
      - $ref: '#/components/schemas/PlatformFailedNotification'
      - $ref: '#/components/schemas/PlatformDeployedUnifiedNotification'
      - $ref: '#/components/schemas/PlatformCompletedNotification'
      - $ref: '#/components/schemas/PlatformCompletedSingleAccountNotification'
      discriminator:
        propertyName: status
        mapping:
          started: '#/components/schemas/PlatformStartedNotification'
          revoked: '#/components/schemas/PlatformRevokedNotification'
          failed: '#/components/schemas/PlatformFailedNotification'
          deployed_unified: '#/components/schemas/PlatformDeployedUnifiedNotification'
          completed: '#/components/schemas/PlatformCompletedNotification'
          completed_account: '#/components/schemas/PlatformCompletedSingleAccountNotification'
    PlatformOnboardingAWSUnified:
      type: object
      description: Unified AWS onboarding status with per-feature stages
      additionalProperties: false
      required:
      - id
      - created_at
      - updated_at
      - issuer_url
      - audience
      - subject
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        issuer_url:
          type: string
          description: URL of the OpenID server
          x-go-name: IssuerURL
        audience:
          type: string
          x-go-name: Audience
        subject:
          type: string
          x-go-name: Subject
        asset_inventory:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedAssetInventory'
        cost_and_usage:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedCostAndUsage'
    PlatformOnboardingAzureWIF:
      type: object
      description: Azure workload identity federation onboarding
      additionalProperties: false
      required:
      - id
      - stage
      - created_at
      - updated_at
      - issuer_url
      - subject
      - audience
      - features
      - setup_script
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        stage:
          type: string
          description: Stage of the onboarding process
          x-go-name: OnboardingStage
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        issuer_url:
          type: string
          description: URL of the OpenID issuer the federated identity credential must trust
          x-go-name: IssuerURL
        subject:
          type: string
          description: OpenID subject claim identifying the CloudQuery tenant
          x-go-name: Subject
        audience:
          type: string
          description: Audience of the federated identity credential
          x-go-name: Audience
        features:
          type: array
          description: List of enabled features
          items:
            type: string
        azure_tenant_id:
          type: string
          description: Azure AD (Entra ID) tenant id, available once completed
          x-go-name: AzureTenantID
        client_id:
          type: string
          description: Application (client) id of the app registration, available once completed
          x-go-name: ClientID
        cost_export_scope:
          type: string
          description: Cost Management scope of the verified FOCUS export, available once verified
          x-go-name: CostExportScope
        cost_export_name:
          type: string
          description: Name of the verified FOCUS export, as Azure spells it
          x-go-name: CostExportName
        cost_storage_account:
          type: string
          description: Blob storage account the verified export delivers to
          x-go-name: CostStorageAccount
        cost_storage_subscription_id:
          type: string
          description: Subscription hosting the destination storage account
          x-go-name: CostStorageSubscriptionID
        cost_storage_container:
          type: string
          description: Blob container the verified export delivers to
          x-go-name: CostStorageContainer
        cost_root_folder_path:
          type: string
          description: Root folder path within the container for the verified export
          x-go-name: CostRootFolderPath
        setup_script:
          type: string
          description: az CLI script to run against the target Azure tenant
          x-go-name: SetupScript
    PlatformOnboardingAWSUnifiedIntegrationsResponse:
      type: object
      description: 'Response containing the integrations created by the unified onboarding flow. Some features create multiple integrations from a single config: asset_inventory creates both a main sync and a companion sync with a "-cloudtrail" suffix, and additional_metadata creates a sync with a "-metadata" suffix. All names are derived from the user-provided name in the request.

        '
      required:
      - integrations
      properties:
        integrations:
          type: array
          items:
            type: object
            required:
            - name
            - feature
            properties:
              name:
                type: string
                description: 'The integration name. For asset_inventory, this may be the base name or the base name with a "-cloudtrail" suffix. For additional_metadata, this is the base name with a "-metadata" suffix.

                  '
              feature:
                type: string
                enum:
                - asset_inventory
                - cost_and_usage
                - additional_metadata
    PlatformFailedNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        required:
        - reason
        properties:
          status:
            enum:
            - failed
          reason:
            type: string
    PlatformOnboardingAzureWIFCompleteRequest:
      type: object
      description: Identifiers created by the Azure workload identity federation setup script
      additionalProperties: false
      required:
      - azure_tenant_id
      - client_id
      properties:
        azure_tenant_id:
          type: string
          description: Azure AD (Entra ID) tenant id hosting the app registration
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          x-pattern-message: must be a GUID
          x-go-name: AzureTenantID
        client_id:
          type: string
          description: Application (client) id of the app registration created by the setup script
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          x-pattern-message: must be a GUID
          x-go-name: ClientID
    PlatformAWSOrganizationAccount:
      type: object
      description: An active account of an AWS Organization
      additionalProperties: false
      required:
      - id
      - name
      - is_management
      properties:
        id:
          type: string
          description: AWS account ID
          x-go-name: ID
        name:
          type: string
          description: Display name of the account
        is_management:
          type: boolean
          description: True for the management account of the organization
    PlatformDeployedUnifiedNotification:
      type: object
      description: Notification sent when unified CloudFormation stack deployment completes
      additionalProperties: false
      required:
      - status
      - stack_id
      properties:
        status:
          type: string
          enum:
          - deployed_unified
        stack_id:
          type: string
          description: CloudFormation stack ARN
        management_role_arn:
          type: string
          description: Management role ARN (present when asset_inventory is active)
          x-go-name: ManagementRoleArn
        deployment_mode:
          type: string
          description: Deployment mode (present when asset_inventory is active)
        cur_main_role_arn:
          type: string
          description: CUR main role ARN (present when cost_and_usage is active)
          x-go-name: CurMainRoleArn
        cur_sync_role_arn:
          type: string
          description: CUR sync role ARN (present when cost_and_usage is active)
          x-go-name: CurSyncRoleArn
        cur_s3_bucket_name:
          type: string
          description: S3 bucket for CUR data (present when cost_and_usage is active)
          x-go-name: CurS3BucketName
        cur_s3_report_prefix:
          type: string
          description: S3 prefix for CUR reports (present when cost_and_usage is active)
          x-go-name: CurS3ReportPrefix
        cur_report_name:
          type: string
          description: BCM Data Export name (present when cost_and_usage is active)
          x-go-name: CurReportName
    PlatformAWSUnifiedTestConnectionsRequest:
      type: object
      description: Request to create test connections for AWS unified features without an onboarding. Each feature is enabled by including its config block. The frontend is responsible for building the full plugin spec (e.g. cloudquery/aws with an accounts array of {role_arn, external_id}) and supplying any external_id values via the env list.
      additionalProperties: false
      properties:
        asset_inventory:
          $ref: '#/components/schemas/PlatformAWSUnifiedFeatureTestConnectionConfig'
        cost_and_usage:
          $ref: '#/components/schemas/PlatformAWSUnifiedFeatureTestConnectionConfig'
        additional_metadata:
          $ref: '#/components/schemas/PlatformAWSUnifiedFeatureTestConnectionConfig'
    PlatformOnboardingAWSUnifiedIntegrationConfig:
      type: object
      description: 'Per-feature configuration for a unified integration: the test connection to promote and an optional schedule override'
      additionalProperties: false
      required:
      - test_connection_id
      properties:
        test_connection_id:
          type: string
          format: uuid
          x-go-name: TestConnectionID
        schedule:
          type: string
          description: Cron schedule for this feature's syncs. Overrides the request-level schedule for this feature only.
    PlatformOnboardingGCPWIFCreateResponse:
      type: object
      description: GCP workload identity federation onboarding create response
      additionalProperties: false
      required:
      - id
      - issuer_url
      - subject
      - pool_id
      - provider_id
      - setup_script
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        issuer_url:
          type: string
          description: URL of the OpenID issuer the workload identity provider must trust
          x-go-name: IssuerURL
        subject:
          type: string
          description: OpenID subject claim identifying the CloudQuery tenant
          x-go-name: Subject
        pool_id:
          type: string
          description: Generated workload identity pool id the setup script creates
          x-go-name: PoolID
        provider_id:
          type: string
          description: Generated workload identity provider id the setup script creates
          x-go-name: ProviderID
        setup_script:
          type: string
          description: gcloud script to run in the target GCP project
          x-go-name: SetupScript
    PlatformOnboardingAzureWIFCreateRequest:
      type: object
      description: Request to create an Azure workload identity federation onboarding
      additionalProperties: false
      required:
      - features
      properties:
        features:
          type: array
          description: List of features to enable
          items:
            type: string
            enum:
            - asset_inventory
            - cost_and_usage
          minItems: 1
    PlatformOrganizationalUnitID:
      description: ID of an organizational unit in AWS
      type: string
      example: ou-7f3s-j8zfa1ao
      pattern: ^ou-[a-z0-9]{4,32}-[a-z0-9]{8,32}$
      x-pattern-message: must start with "ou-" followed by 4 to 32 lowercase letters or digits, then a second "-" dash, and finally 8 to 32 additional lowercase letters or digits
      x-go-name: OrganizationalUnitID
    PlatformOnboardingAWSUnifiedCostAndUsage:
      type: object
      description: Cost and usage feature status and details
      additionalProperties: false
      required:
      - stage
      properties:
        stage:
          type: string
          description: 'Stage of the cost and usage feature. Values: pending, started, deployed, provisioning, verified, failed, revoked.

            '
        failure_reason:
          type: string
          description: Error details if the feature failed
          x-go-name: FailureReason
        sync_role_arn:
          type: string
          x-go-name: SyncRoleARN
        s3_bucket_name:
          type: string
          x-go-name: S3BucketName
        s3_report_prefix:
          type: string
          x-go-name: S3ReportPrefix
        cur_report_name:
          type: string
          x-go-name: CURReportName
    PlatformDeployedNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        required:
        - management_role_arn
        - deployment_mode
        - stack_id
        properties:
          status:
            enum:
            - deployed
          management_role_arn:
            type: string
          deployment_mode:
            type: string
          stack_id:
            type: string
    PlatformOnboardingGCPBillingExportRequest:
      type: object
      description: Location of the BigQuery Cloud Billing export to verify
      additionalProperties: false
      required:
      - project_id
      - dataset_id
      properties:
        project_id:
          type: string
          description: GCP project holding the BigQuery dataset the billing export is written to
          pattern: ^(?:[a-z0-9][a-z0-9.-]*:)?[a-z][a-z0-9-]{4,28}[a-z0-9]$
          x-pattern-message: must be a GCP project id
          x-go-name: ProjectID
        dataset_id:
          type: string
          description: BigQuery dataset the billing export is written to
          pattern: ^\w{1,1000}$
          x-pattern-message: must be a BigQuery dataset id
          x-go-name: DatasetID
        table:
          type: string
          description: Table within the dataset to read, without the project or dataset qualifier. Omit it to discover the detailed usage cost export in the dataset.
          pattern: ^$|^[\w-]{1,1000}$
          x-pattern-message: must be a BigQuery table name without a project or dataset prefix
          x-go-name: Table
    PlatformOnboardingAWSUnifiedAssetInventory:
      type: object
      description: Asset inventory feature status and details
      additionalProperties: false
      required:
      - stage
      properties:
        stage:
          type: string
          description: 'Stage of the asset inventory feature. Values: pending, started, deployed, provisioning, completed, failed, revoked.

            '
        failure_reason:
          type: string
          description: Error details if the feature failed
          x-go-name: FailureReason
        management_role_arn:
          type: string
          x-go-name: ManagementRoleARN
        deployment_mode:
          type: string
        admin_role_arn:
          type: string
          x-go-name: AdminRoleARN
        sync_role_name:
          type: string
          x-go-name: SyncRoleName
          description: Name of the sync role in each onboarded account
        organizational_units:
          type: array
          x-go-name: OrganizationalUnitIDs
          items:
            type: string
        skipped_accounts:
          type: array
          x-go-name: SkippedAccountIDs
          items:
            type: string
        failed_accounts_count:
          type: integer
          x-go-name: FailedAccountsCount
    PlatformOnboardingAWSCUR:
      type: object
      description: AWS CUR onboarding
      additionalProperties: false
      required:
      - id
      - stage
      - created_at
      - updated_at
      - issuer_url
      - audience
      - subject
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        stage:
          type: string
          description: Stage of the onboarding process
          x-go-name: OnboardingStage
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        issuer_url:
          type: string
          description: URL of the OpenID server to use when setting up a trust relationship
          x-go-name: IssuerURL
        audience:
          type: string
          description: OpenID audience claim for the trust relationship
          x-go-name: Audience
        subject:
          type: string
          description: OpenID subject claim for the trust relationship
          x-go-name: Subject
        sync_role_arn:
          type: string
          description: Role used to access the S3 bucket with CUR reports
          x-go-name: SyncRoleARN
        s3_bucket_name:
          type: string
          description: Name of the S3 bucket containing CUR reports
          x-go-name: S3BucketName
        s3_report_prefix:
          type: string
          description: Prefix path for CUR reports in the S3 bucket
          x-go-name: S3ReportPrefix
        cur_report_name:
          type: string
          description: Name of the CUR report
          x-go-name: CURReportName
        failure_reason:
          type: string
          description: Error details if the onboarding failed
          x-go-name: FailureReason
    PlatformOnboardingAWSUnifiedCreateResponse:
      type: object
      description: Response when creating a unified AWS onboarding
      additionalProperties: false
      required:
      - id
      - features
      - issuer_url
      - audience
      - subject
      - template_url
      - notify_path
      - notify_token
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        features:
          type: array
          items:
            type: string
            enum:
            - asset_inventory
            - cost_and_usage
            - additional_metadata
        region:
          type: string
          description: AWS region for stack deployment. Forced to us-east-1 when cost_and_usage is included.
        stack_name:
          type: string
          description: CloudFormation stack name to use
          maxLength: 128
        issuer_url:
          type: string
          description: URL of the OpenID server to use when setting up a trust relationship
          x-go-name: IssuerURL
        audience:
          type: string
          description: OpenID audience claim for the trust relationship
          x-go-name: Audience
        subject:
          type: string
          description: OpenID subject claim for the trust relationship
          x-go-name: Subject
        notify_path:
          type: string
          description: Path of the notify endpoint to use for status updates
          x-go-name: NotifyPath
        template_url:
          type: string
          description: URL of the composed CloudFormation template matching requested features
          x-go-name: TemplateURL
        notify_token:
          type: string
          description: Authentication token for notifications
    PlatformOnboardingAWSNotification:
      oneOf:
      - $ref: '#/components/schemas/PlatformStartedNotification'
      - $ref: '#/components/schemas/PlatformRevokedNotification'
      - $ref: '#/components/schemas/PlatformFailedNotification'
      - $ref: '#/components/schemas/PlatformDeployedNotification'
      - $ref: '#/components/schemas/PlatformCompletedNotification'
      - $ref: '#/components/schemas/PlatformCompletedSingleAccountNotification'
      discriminator:
        propertyName: status
        mapping:
          started: '#/components/schemas/PlatformStartedNotification'
          revoked: '#/components/schemas/PlatformRevokedNotification'
          failed: '#/components/schemas/PlatformFailedNotification'
          deployed: '#/components/schemas/PlatformDeployedNotification'
          completed: '#/components/schemas/PlatformCompletedNotification'
          completed_account: '#/components/schemas/PlatformCompletedSingleAccountNotification'
    PlatformDisplayName:
      description: A human-readable display name
      minLength: 1
      maxLength: 255
      pattern: ^[a-zA-Z\p{L}\p{N}_][a-zA-Z\p{L}\p{N}_ \-'\(\)\[\]]*$
      x-pattern-message: can contain only letters, numbers, spaces, hyphens, underscores, brackets and apostrophes
      type: string
      example: Human Readable Name
    PlatformCompletedNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
