      additionalProperties: false
      required:
      - test_connections
      properties:
        test_connections:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - feature
            - test_connection_id
            - plugin_path
            properties:
              feature:
                type: string
                enum:
                - asset_inventory
                - cost_and_usage
                - additional_metadata
              test_connection_id:
                type: string
                format: uuid
                x-go-name: TestConnectionID
              plugin_path:
                type: string
    PlatformOnboardingAWSUnifiedCreateRequest:
      type: object
      description: Request to create a unified AWS onboarding
      additionalProperties: false
      required:
      - features
      properties:
        features:
          type: array
          description: 'List of features to enable. Determines the CloudFormation template composition.

            '
          items:
            type: string
            enum:
            - asset_inventory
            - cost_and_usage
            - additional_metadata
          minItems: 1
        single_account:
          type: boolean
          default: false
          description: 'Only relevant when asset_inventory is selected. If true, uses single-account mode instead of organization mode.

            '
    PlatformDeployedCURNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        required:
        - main_role_arn
        - sync_role_arn
        - s3_bucket_name
        - s3_report_prefix
        - cur_report_name
        - stack_id
        properties:
          status:
            enum:
            - deployed_cur
          main_role_arn:
            type: string
          sync_role_arn:
            type: string
          s3_bucket_name:
            type: string
          s3_report_prefix:
            type: string
          cur_report_name:
            type: string
          stack_id:
            type: string
    PlatformOnboardingAWSCURNotification:
      oneOf:
      - $ref: '#/components/schemas/PlatformStartedNotification'
      - $ref: '#/components/schemas/PlatformRevokedNotification'
      - $ref: '#/components/schemas/PlatformFailedNotification'
      - $ref: '#/components/schemas/PlatformDeployedCURNotification'
      discriminator:
        propertyName: status
        mapping:
          started: '#/components/schemas/PlatformStartedNotification'
          revoked: '#/components/schemas/PlatformRevokedNotification'
          failed: '#/components/schemas/PlatformFailedNotification'
          deployed_cur: '#/components/schemas/PlatformDeployedCURNotification'
    PlatformOnboardingAWS:
      type: object
      description: AWS OpenID onboarding
      additionalProperties: false
      required:
      - id
      - stage
      - created_at
      - updated_at
      - issuer_url
      - audience
      - subject
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        stage:
          type: string
          description: Stage of the onboarding process
          x-go-name: OnboardingStage
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        issuer_url:
          type: string
          description: URL of the OpenID server to use when setting up a trust relationship
          x-go-name: IssuerURL
        audience:
          type: string
          description: OpenID audience claim for the trust realshionship
          x-go-name: Audience
        subject:
          type: string
          description: OpenID subject claim for the trust relationship
          x-go-name: Subject
        management_role_arn:
          type: string
          description: Role used to manage the platform onboarding
          x-go-name: ManagementRoleARN
        failure_reason:
          type: string
          description: CloudFormation stack errors
          x-go-name: FailureReason
        sync_role_name:
          type: string
          x-go-name: SyncRoleName
          description: '(organization mode) The name of the sync role used to sync a specific account within the organization.

            Note: This is the role name only, not the full ARN.

            '
        organizational_units:
          type: array
          x-go-name: OrganizationalUnitIDs
          description: '(organization mode) A list of Organizational Unit (OU) IDs included in this onboarding.

            '
          items:
            type: string
    PlatformOnboardingAzureCostExportRequest:
      type: object
      description: Location of the Azure Cost Management FOCUS export to verify
      additionalProperties: false
      required:
      - scope
      - export_name
      properties:
        scope:
          type: string
          description: Cost Management scope the export is defined at, without a leading slash, for example subscriptions/00000000-0000-0000-0000-000000000000 or providers/Microsoft.Billing/billingAccounts/1234567. An export is only visible at the scope it was created at.
          pattern: ^/?[A-Za-z0-9][\w.\-/:()]{0,999}$
          x-pattern-message: must be a Cost Management scope path
          x-go-name: Scope
        export_name:
          type: string
          description: Name of the Cost Management export within the scope, without a scope prefix.
          pattern: ^[\w.\-]{1,1000}$
          x-pattern-message: must be a Cost Management export name without a scope prefix
          x-go-name: ExportName
    PlatformOnboardingAWSUnifiedTestConnectionsRequest:
      type: object
      description: Request to create test connections for all enabled features
      additionalProperties: false
      properties:
        asset_inventory:
          type: object
          description: Configuration for asset inventory test connection (regions, etc.)
          additionalProperties: true
        cost_and_usage:
          type: object
          description: Configuration for cost and usage test connection
          additionalProperties: true
        additional_metadata:
          type: object
          description: Configuration for additional metadata test connection
          additionalProperties: true
    PlatformOnboardingAWSCreateResponse:
      type: object
      description: AWS OpenID onboarding
      additionalProperties: false
      required:
      - id
      - issuer_url
      - audience
      - subject
      - template_url
      - notify_path
      - notify_token
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        region:
          type: string
          description: An AWS region (such as 'us-east-1') where stack is deployed
        stack_name:
          type: string
          description: Stack name that should be used
          maxLength: 128
        issuer_url:
          type: string
          description: URL of the OpenID server to use when setting up a trust relationship
          x-go-name: IssuerURL
        audience:
          type: string
          description: OpenID audience claim for the trust realshionship
          x-go-name: Audience
        subject:
          type: string
          description: OpenID subject claim for the trust relationship
          x-go-name: Subject
        notify_path:
          type: string
          description: Path of the notify endpoint to use for status updates
          x-go-name: NotifyPath
        template_url:
          type: string
          description: URL of the CloudFormation template to use for the authentication
          x-go-name: TemplateURL
        notify_token:
          type: string
          description: An authentication token that should be used for notifications
    PlatformBaseNotification:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    PlatformOnboardingGCPWIF:
      type: object
      description: GCP workload identity federation onboarding
      additionalProperties: false
      required:
      - id
      - stage
      - created_at
      - updated_at
      - issuer_url
      - subject
      - features
      - pool_id
      - provider_id
      - setup_script
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        stage:
          type: string
          description: Stage of the onboarding process
          x-go-name: OnboardingStage
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        issuer_url:
          type: string
          description: URL of the OpenID issuer the workload identity provider must trust
          x-go-name: IssuerURL
        subject:
          type: string
          description: OpenID subject claim identifying the CloudQuery tenant
          x-go-name: Subject
        features:
          type: array
          description: List of enabled features
          items:
            type: string
        pool_id:
          type: string
          description: Workload identity pool id
          x-go-name: PoolID
        provider_id:
          type: string
          description: Workload identity provider id
          x-go-name: ProviderID
        audience:
          type: string
          description: Workload identity provider audience, available once completed
          x-go-name: Audience
        project_number:
          type: string
          description: GCP project number, available once completed
          x-go-name: ProjectNumber
        service_account_email:
          type: string
          description: Impersonated service account email, available once completed
          x-go-name: ServiceAccountEmail
        setup_script:
          type: string
          description: gcloud script to run in the target GCP project
          x-go-name: SetupScript
    PlatformOnboardingAWSAccounts:
      type: object
      description: AWS OpenID onboarding account structure
      additionalProperties: false
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: ID of the account or OU
          x-go-name: ID
        arn:
          type: string
          description: ARN of the account or OU
          x-go-name: ARN
        type:
          type: string
          description: Type of the account
          enum:
          - OU
          - account
          - root
        name:
          type: string
          description: Display name of the account or OU
        children:
          type: array
          description: Children accounts and OUs of the target account
          items:
            $ref: '#/components/schemas/PlatformOnboardingAWSAccounts'
    PlatformOnboardingGCPWIFCreateRequest:
      type: object
      description: Request to create a GCP workload identity federation onboarding
      additionalProperties: false
      required:
      - features
      properties:
        features:
          type: array
          description: List of features to enable
          items:
            type: string
            enum:
            - asset_inventory
          minItems: 1
    PlatformOnboardingAzureCostExportResponse:
      type: object
      description: The verified FOCUS cost export CloudQuery will read, with the storage destination resolved from the export's own delivery settings rather than from the request.
      additionalProperties: false
      required:
      - scope
      - export_name
      - storage_account
      - container
      - prefix
      - blob_count
      - source_spec
      properties:
        scope:
          type: string
          description: Cost Management scope the export was resolved at, without a leading slash
          x-go-name: Scope
        export_name:
          type: string
          description: Name of the verified Cost Management export
          x-go-name: ExportName
        storage_account:
          type: string
          description: Blob storage account the export delivers to
          x-go-name: StorageAccount
        storage_subscription_id:
          type: string
          description: Subscription hosting the destination storage account. An export may deliver outside its own scope, so this is not necessarily the scope's subscription.
          x-go-name: StorageSubscriptionID
        container:
          type: string
          description: Blob container the export delivers to
          x-go-name: Container
        root_folder_path:
          type: string
          description: Root folder path within the container, empty when the export delivers to the container root
          x-go-name: RootFolderPath
        prefix:
          type: string
          description: Blob prefix the delivered runs live under, always ending in a slash
          x-go-name: Prefix
        blob_count:
          type: integer
          description: Number of delivered blobs found under the prefix, capped by the platform
          x-go-name: BlobCount
        source_spec:
          description: Generated azurecost source plugin spec for this export. Submit it verbatim when creating the cost integration; credentials are injected at sync time from the onboarding and must not be added here.
          type: object
          additionalProperties: true
          x-go-name: SourceSpec
    PlatformOnboardingAWSProvision:
      type: object
      description: Stackset provisioning configuration
      required:
      - notify_url
      - organizational_units
      properties:
        notify_url:
          type: string
          description: URL that should be used for provisioning notifications (including scheme, hostname, and path)
        organizational_units:
          type: array
          description: OUs to provision roles into
          items:
            type: string
            pattern: ^(r-[0-9a-z]{4,32}|ou-[a-z0-9]{4,32}-[a-z0-9]{8,32})$
            example: r-xvfz
            x-pattern-message: must start with either "r-" followed by 4 to 32 lowercase letters or digits,  or "ou-" followed by 4 to 32 lowercase letters or digits, a hyphen, and then  8 to 32 lowercase letters or digits, with no additional characters before or after.
        skip_accounts:
          type: array
          description: Account IDs to skip onboarding
          items:
            description: ID of an account in AWS
            type: string
            example: '615713231484'
            pattern: ^\d{12}$
            x-pattern-message: account ID must be exactly 12 digits
    PlatformCompletedSingleAccountNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        required:
        - sync_role_arn
        - stack_id
        properties:
          status:
            enum:
            - completed_account
          sync_role_arn:
            type: string
          stack_id:
            type: string
    PlatformOnboardingGCPWIFCompleteRequest:
      type: object
      description: Identifiers created by the GCP workload identity federation setup script
      additionalProperties: false
      required:
      - project_number
      - pool_id
      - provider_id
      - service_account_email
      properties:
        project_number:
          type: string
          description: Numeric GCP project number hosting the workload identity pool
          pattern: ^[0-9]{1,30}$
          x-pattern-message: must be a numeric GCP project number
          x-go-name: ProjectNumber
        pool_id:
          type: string
          description: Workload identity pool id created by the setup script
          pattern: ^[a-z0-9-]{4,32}$
          x-pattern-message: must be 4-32 lowercase letters, digits or hyphens
          x-go-name: PoolID
        provider_id:
          type: string
          description: Workload identity provider id created by the setup script
          pattern: ^[a-z0-9-]{4,32}$
          x-pattern-message: must be 4-32 lowercase letters, digits or hyphens
          x-go-name: ProviderID
        service_account_email:
          type: string
          description: Email of the service account created by the setup script
          format: email
          x-go-name: ServiceAccountEmail
    PlatformRevokedNotification:
      allOf:
      - $ref: '#/components/schemas/PlatformBaseNotification'
      - type: object
        properties:
          status:
            enum:
            - revoked
    PlatformFieldError:
      allOf:
      - $ref: '#/components/schemas/PlatformBasicError'
      - properties:
          errors:
            items:
              type: string
            type: array
          field_errors:
            additionalProperties:
              type: string
            type: object
        type: object
    PlatformOnboardingAzureWIFCreateResponse:
      type: object
      description: Azure workload identity federation onboarding create response
      additionalProperties: false
      required:
      - id
      - issuer_url
      - subject
      - audience
      - setup_script
      properties:
        id:
          $ref: '#/components/schemas/PlatformOnboardingID'
        issuer_url:
          type: string
          description: URL of the OpenID issuer the federated identity credential must trust
          x-go-name: IssuerURL
        subject:
          type: string
          description: OpenID subject claim identifying the CloudQuery tenant
          x-go-name: Subject
        audience:
          type: string
          description: Audience of the federated identity credential
          x-go-name: Audience
        setup_script:
          type: string
          description: az CLI script to run against the target Azure tenant
          x-go-name: SetupScript
    PlatformBasicError:
      additionalProperties: false
      description: Basic Error
      required:
      - message
      - status
      properties:
        message:
          type: string
        status:
          type: integer
      title: Basic Error
      type: object
    PlatformAWSUnifiedIntegrationsRequest:
      type: object
      description: 'Request to create AWS unified integrations from previously created standalone test connections (no onboarding). Sub-integrations derive their names from the base name: asset_inventory creates -asset-inventory and -cloudtrail syncs, additional_metadata creates a -metadata sync, and cost_and_usage creates a -cost-and-usage sync.'
      additionalProperties: false
      required:
      - destination_names
      properties:
        name:
          type: string
          description: Base name for the integrations. Sub-integrations derive their names from this value. When omitted, the server derives it from display_name (or the plugin name) and adds a numeric suffix if needed so every sub-integration name is unique.
        display_name:
          $ref: '#/components/schemas/PlatformDisplayName'
        destination_names:
          type: array
          items:
            type: string
        schedule:
          type: string
          description: Cron schedule for every created sync. A feature block's own schedule overrides it for that feature.
        asset_inventory:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
        cost_and_usage:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
        additional_metadata:
          $ref: '#/components/schemas/PlatformOnboardingAWSUnifiedIntegrationConfig'
    PlatformAWSOrganizationUnit:
      type: object
      description: An organizational unit (or the Root) with its child OUs and its accounts
      additionalProperties: false
      required:
      - id
      - name
      - children
      - accounts
      properties:
        id:
          type: string
          description: ID of the OU or the Root
          x-go-name: ID
        name:
          type: string
          description: Display name of the OU or the Root
        children:
          type: array
          description: Child OUs
          items:
            $ref: '#/components/schemas/PlatformAWSOrganizationUnit'
        accounts:
          type: array
          description: Accounts directly in this OU
          items:
            $ref: '#/components/schemas/PlatformAWSOrganizationAccount'
    PlatformOnboardingID:
      description: ID of the cloud provider onboarding session
      type: string
      format: uuid
      example: 12345678-1234-1234-1234-1234567890ab
      x-go-name: OnboardingID
    PlatformAWSOrganizationDiscoverRequest:
      type: object
      description: Role in the management account of the AWS Organization to discover
      additionalProperties: false
      required:
      - role_arn
      - external_id
      properties:
        role_arn:
          type: string
          minLength: 1
          description: ARN of the read role in the management account
          x-go-name: RoleARN
        external_id:
          type: string
          minLength: 1
          description: External ID the role trusts
          x-go-name: ExternalID
  responses:
    PlatformConflict:
