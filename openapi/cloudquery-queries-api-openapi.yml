openapi: 3.2.0
info:
  contact:
    email: support@cloudquery.io
    name: CloudQuery Support Team
    url: https://cloudquery.io
  description: 'Welcome to the CloudQuery Platform API documentation! This API can be used to interact with the CloudQuery platform. As a user, the API allows you to search the CloudQuery asset inventory, run SQL queries against the data warehouse, save and load searches, and much more. As an administrator, it allows you to manage your teams, syncs, and other objects.

    ### Authentication

    The API is secured using bearer tokens. To get started, you can generate an API key for your Platform deployment from your platform dashboard. For a step-by-step guide, see: https://www.cloudquery.io/docs/cli/managing-cloudquery/deployments/generate-api-key.

    The base URL for the API depends on where your CloudQuery Platform is hosted. If running locally, this is usually http://localhost:3000/api. In a production deployment it should be an HTTPS URL. For purposes of illustration, we will assume the platform instance is available at https://cloudquery.mycompany.com. In this case, the base API endpoint will be https://cloudquery.mycompany.com/api.

    ### Example Request

    To test your connection to the API, we can use the `/plugins` endpoint. For example:

    `curl -v -H "Authorization: Bearer $CLOUDQUERY_API_KEY" \ https://cloudquery.mycompany.com/api/plugins`'
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://www.cloudquery.io/terms
  title: CloudQuery Platform OpenAPI Spec Queries API
  version: 1.0.0
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: Queries
paths:
  /queries:
    get:
      description: List all queries
      operationId: PlatformListAllQueries
      parameters:
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_query_tags'
      - $ref: '#/components/parameters/platform_query_name_filter'
      - $ref: '#/components/parameters/platform_query_filter'
      - $ref: '#/components/parameters/platform_query_column_filter'
      - $ref: '#/components/parameters/platform_query_for_policy'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/PlatformQuery'
                    type: array
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform list all queries
      x-summary-source: derived
  /queries/check-syntax:
    post:
      description: Validate the syntax of a ClickHouse SQL query without executing it. Returns 200 if the syntax is valid, or 400 with an error message if not.
      operationId: PlatformCheckQuerySyntax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - query
              properties:
                query:
                  type: string
                  description: The SQL query to validate
                  example: SELECT account_id, instance_id FROM aws_ec2_instance WHERE instance_type = 't2.micro'
      responses:
        '200':
          description: Query syntax is valid
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform check query syntax
      x-summary-source: derived
  /queries/columns:
    post:
      description: Return the list of output column names a SELECT query would produce, without executing it. Columns from `SELECT *` are resolved against the referenced table schemas. Returns 400 if the query cannot be parsed or is not a SELECT.
      operationId: PlatformGetQueryColumns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - query
              properties:
                query:
                  type: string
                  description: The SQL query to inspect
                  example: SELECT _cq_platform_id, account_id, instance_id FROM aws_ec2_instance WHERE instance_type = 't2.micro'
      responses:
        '200':
          description: Column names the query would produce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueryColumns'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform get query columns
      x-summary-source: derived
  /queries/execute:
    post:
      description: 'Run an ad-hoc SQL query against any table.

        Further filtering can optionally be applied on top of the raw SQL results using the optional parameters. Filtering can be useful in situations where a saved query needs to be further filtered, grouped or paginated, such as in dashboards or reports.'
      operationId: PlatformExecuteAdHocQuery
      parameters:
      - $ref: '#/components/parameters/platform_table_selects'
      - $ref: '#/components/parameters/platform_table_filter_mode'
      - $ref: '#/components/parameters/platform_table_filters'
      - $ref: '#/components/parameters/platform_table_filter_ids'
      - $ref: '#/components/parameters/platform_table_sort_bys'
      - $ref: '#/components/parameters/platform_table_sort_dirs'
      - $ref: '#/components/parameters/platform_table_group_bys'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - query
              properties:
                query:
                  type: string
                  example: SELECT account_id, instance_id, instance_type, region, name, tags FROM aws_ec2_instance WHERE instance_type = 't2.micro'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - data
                - metadata
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformTableData'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform execute ad hoc query
      x-summary-source: derived
  /queries/save:
    post:
      description: Save a query to execute later
      operationId: PlatformSaveQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformQueryCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueryDetail'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform save query
      x-summary-source: derived
  /queries/tags:
    get:
      description: List Query Tags
      operationId: PlatformListQueryTags
      parameters:
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformQueryTag'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform list query tags
      x-summary-source: derived
  /queries/{query_id}:
    get:
      description: Get a saved query
      operationId: PlatformGetSavedQuery
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueryDetail'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform get saved query
      x-summary-source: derived
    patch:
      description: Update a saved query
      operationId: PlatformUpdateQuery
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformQueryUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueryDetail'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform update query
      x-summary-source: derived
    delete:
      description: Delete a saved query
      operationId: PlatformDeleteSavedQuery
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform delete saved query
      x-summary-source: derived
  /queries/{query_id}/execute:
    post:
      description: Execute a saved query
      operationId: PlatformExecuteSavedQuery
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      - $ref: '#/components/parameters/platform_table_selects'
      - $ref: '#/components/parameters/platform_table_filter_mode'
      - $ref: '#/components/parameters/platform_table_filters'
      - $ref: '#/components/parameters/platform_table_filter_ids'
      - $ref: '#/components/parameters/platform_table_sort_bys'
      - $ref: '#/components/parameters/platform_table_sort_dirs'
      - $ref: '#/components/parameters/platform_table_group_bys'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - data
                - metadata
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformTableData'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform execute saved query
      x-summary-source: derived
  /queries/{query_id}/filters:
    get:
      description: List Query Filters
      operationId: PlatformQueryListFilters
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_filter_tags'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformFilter'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform query list filters
      x-summary-source: derived
    post:
      description: Save Query Filter
      operationId: PlatformQuerySaveFilter
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformFilterCreate'
      responses:
        '200':
          description: Filter already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformFilter'
        '201':
          description: Filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformFilter'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform query save filter
      x-summary-source: derived
  /queries/{query_id}/filters/tags:
    get:
      description: List Filter Tags For A Saved Query
      operationId: PlatformQueryListFilterTags
      parameters:
      - $ref: '#/components/parameters/platform_query_id'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformFilterTag'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform query list filter tags
      x-summary-source: derived
  /tables/{table_name}/filters/tags:
    get:
      description: List Filter Tags For A Table
      operationId: PlatformTableListFilterTags
      parameters:
      - $ref: '#/components/parameters/platform_table_name'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformFilterTag'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Queries
      summary: Platform table list filter tags
      x-summary-source: derived
components:
  parameters:
    platform_table_filters:
      name: filter
      in: query
      description: 'Table filters. This filters the rows that are returned in the result set.


        The reserved pseudo-column `_cq_app_id` filters by app membership, e.g. `_cq_app_id = "<uuid>"`. Select multiple apps (union) within a single filter using `_cq_app_id IN ("<uuid>", "<uuid>")` or `_cq_app_id = "<a>" OR _cq_app_id = "<b>"`. Exclude apps with `_cq_app_id != "<uuid>"` or `_cq_app_id NOT IN ("<uuid>", "<uuid>")`, which match resources that do not belong to the named app(s); a negated form must be a standalone filter (not OR/AND-combined). Use `_cq_app_id IS EMPTY` to scope to unallocated resources (those belonging to no app); it cannot be combined with a positive `_cq_app_id` filter. `_cq_app_id` cannot be mixed with other columns inside one filter — combine it with other filters by passing them as separate `filter` parameters, which AND together. It is reserved in CloudQuery''s `_cq_` namespace, so it never shadows a plugin''s physical `app_id` column.


        The reserved pseudo-column `_cq_environment` filters by environment membership the same way, e.g. `_cq_environment = "prod"`, `_cq_environment IN ("prod", "staging")`, `_cq_environment != "prod"`, `_cq_environment NOT IN ("dev", "staging")` and `_cq_environment IS EMPTY` for resources classified into no environment. Environments are identified by NAME (an exact, case-sensitive match on a name the warehouse holds), not by id — unlike apps they have no registry. The same composition rules apply: negated forms must stand alone, `IS EMPTY` cannot be combined with a positive value, and it cannot be mixed with other columns inside one filter. `_cq_app_id` and `_cq_environment` in separate `filter` parameters AND together, so an app and an environment filter compose.


        The reserved pseudo-column `_cq_owner` filters by the owner the tenant''s ownership rules resolved onto each resource, e.g. `_cq_owner = "platform@example.com"`, `_cq_owner IN ("a@example.com", "b@example.com")`, `_cq_owner != "a@example.com"`, `_cq_owner NOT IN ("a@example.com", "b@example.com")` and `_cq_owner IS EMPTY` for resources no rule claimed. Owners are free-form values produced by the rules (an exact, case-sensitive match), so like environments they have no registry and an empty value is rejected — ask for unowned resources with `IS EMPTY`. The same composition rules apply. A tenant with no ownership policy has no owned resources, so every positive `_cq_owner` filter matches nothing and `_cq_owner IS EMPTY` matches everything. This is the same key the single-resource detail endpoint returns the resolved owner under; the list/grid endpoint accepts it as a filter but does not yet return it on rows.


        All three pseudo-columns are filter-only: they resolve through a subquery against a side table rather than a column of the queried table, so passing one to `sort_by` or `group_by` is rejected.


        They are honored by the table-data endpoints and by `/tables/{table_name}/columns/{column_name}/grouped`, whichever column is grouped, so a filtered listing and its group counts agree. The remaining endpoints that accept this parameter — ad-hoc and saved query execution, log queries, and distinct column values — treat an unknown column as an error, so passing one there is rejected rather than silently ignored.'
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformFilterExpression'
      x-go-type-skip-optional-pointer: true
      x-go-name: Filters
    platform_table_filter_mode:
      name: filter_mode
      in: query
      description: 'Table filter mode.


        Smart mode switches between column and search mode based on the filtered table and


        Search mode allows searching deeply nested data but is not available on all tables as it requires a separate indexing step.

        Search mode is only available on resource tables or queries derived from resource tables results that contain _cq_id and _cq_source_id.

        Search mode may also be used against cloud_assets but it will only return results from resource tables.


        Column mode searches purely using the columns in the table.

        It will work on all table results but it is not optimized for arbitrary substring searches and so may be slow on larger tables.

        '
      schema:
        type: string
        enum:
        - smart
        - search
        - column
        default: smart
    platform_query_for_policy:
      name: for_policy
      in: query
      description: 'When true, return only queries eligible as policy rule logic: every referenced table is currently synced and the query outputs the _cq_platform_id column (implies column_filter=_cq_platform_id)'
      required: false
      schema:
        type: boolean
    platform_query_tags:
      name: tag
      in: query
      description: Query tags
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformQueryTag'
      x-go-type-skip-optional-pointer: true
      x-go-name: QueryTags
    platform_table_selects:
      name: select
      in: query
      description: Table selects. This filters the columns that are returned in the result set. If empty, all default columns + internal _cq_* columns are returned. To select all columns, use the `*` wildcard.
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformTableSelect'
      x-go-type-skip-optional-pointer: true
      x-go-name: Selects
    platform_table_sort_bys:
      name: sort_by
      in: query
      description: Table sort by options. This sorts the rows that are returned in the result set.
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformTableSortBy'
      x-go-type-skip-optional-pointer: true
      x-go-name: SortBys
    platform_query_id:
      in: path
      name: query_id
      required: true
      schema:
        $ref: '#/components/schemas/PlatformQueryID'
      x-go-name: QueryID
    platform_page:
      description: Page number of the results to fetch
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
        format: int64
    platform_filter_tags:
      name: tag
      in: query
      description: Filter tags
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformFilterTag'
      x-go-name: FilterTags
    platform_table_group_bys:
      name: group_by
      in: query
      description: Table group by options. This groups the rows that are returned in the result set by the given columns.
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformTableGroupBy'
      x-go-type-skip-optional-pointer: true
      x-go-name: GroupBys
    platform_table_filter_ids:
      name: filter_id
      in: query
      description: 'Table filter IDs. These should be valid Saved Filter IDs. These filters

        will be applied to the query results before returning them.

        '
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformFilterID'
      x-go-type-skip-optional-pointer: true
      x-go-name: FilterIDs
    platform_query_name_filter:
      name: name_filter
      in: query
      required: false
      schema:
        description: Filter by query name.
        type: string
    platform_table_name:
      in: path
      name: table_name
      required: true
      schema:
        $ref: '#/components/schemas/PlatformTableName'
    platform_query_filter:
      name: query_filter
      in: query
      required: false
      schema:
        description: Filter by query
        type: string
    platform_table_sort_dirs:
      name: sort_dir
      in: query
      description: Table sort direction options. This sorts the rows that are returned in the result set.
      allowEmptyValue: true
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PlatformTableSortDirection'
      x-go-type-skip-optional-pointer: true
      x-go-name: SortDirections
    platform_per_page:
      description: The number of results per page (max 1000).
      in: query
      name: per_page
      required: false
      schema:
        default: 100
        maximum: 1000
        minimum: 1
        type: integer
        format: int64
    platform_query_column_filter:
      name: column_filter
      in: query
      description: Filter queries that return all specified columns
