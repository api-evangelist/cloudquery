      properties:
        id:
          type: string
          description: Channel ID
        name:
          type: string
          description: Channel name
        is_private:
          type: boolean
          description: Whether the channel is private
          x-go-name: IsPrivate
        is_archived:
          type: boolean
          description: Whether the channel is archived
          x-go-name: IsArchived
    PlatformNotificationRule:
      title: Notification Rule
      type: object
      description: One notification rule as the client sends it. Rules are ordered and first-match-wins per resource; the insight default and the global default are both simply unconditional rules pinned last.
      additionalProperties: false
      required:
      - enabled
      - conditions
      - outcome
      - destinations
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Omitted or null creates a new rule and the server assigns the ID. Echo an existing ID back to update that rule in place - the whole-list PUT reconciles by ID, so an ID that disappears from the list is deleted along with its per-resource notification state.
        name:
          type: string
          nullable: true
          description: Optional label shown in the rules list.
        enabled:
          type: boolean
          description: A disabled rule is skipped during evaluation but keeps its per-resource state, so re-enabling it does not re-fire everything it already matched.
        conditions:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/PlatformNotificationRuleCondition'
          description: 'Conditions on the affected resource, ANDed together. An empty array is an unconditional rule: it matches every resource, so it must be the last rule in the list and there can only be one.'
        outcome:
          type: string
          enum:
          - deliver
          - suppress
          description: '`deliver` sends to `destinations`; `suppress` records the match and sends nothing. Suppress never touches alert state - that is what silencing is for.'
        destinations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlatformNotificationRuleDestination'
          description: May be empty when `outcome` is `suppress`.
