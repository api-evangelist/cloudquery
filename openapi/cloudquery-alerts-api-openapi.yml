openapi: 3.2.0
info:
  contact:
    email: support@cloudquery.io
    name: CloudQuery Support Team
    url: https://cloudquery.io
  description: 'Welcome to the CloudQuery Platform API documentation! This API can be used to interact with the CloudQuery platform. As a user, the API allows you to search the CloudQuery asset inventory, run SQL queries against the data warehouse, save and load searches, and much more. As an administrator, it allows you to manage your teams, syncs, and other objects.

    ### Authentication

    The API is secured using bearer tokens. To get started, you can generate an API key for your Platform deployment from your platform dashboard. For a step-by-step guide, see: https://www.cloudquery.io/docs/cli/managing-cloudquery/deployments/generate-api-key.

    The base URL for the API depends on where your CloudQuery Platform is hosted. If running locally, this is usually http://localhost:3000/api. In a production deployment it should be an HTTPS URL. For purposes of illustration, we will assume the platform instance is available at https://cloudquery.mycompany.com. In this case, the base API endpoint will be https://cloudquery.mycompany.com/api.

    ### Example Request

    To test your connection to the API, we can use the `/plugins` endpoint. For example:

    `curl -v -H "Authorization: Bearer $CLOUDQUERY_API_KEY" \ https://cloudquery.mycompany.com/api/plugins`'
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://www.cloudquery.io/terms
  title: CloudQuery Platform OpenAPI Spec Alerts API
  version: 1.0.0
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: Alerts
paths:
  /notifications/defaults/{type}:
    get:
      description: Get the tenant-global default notification destinations for a type
      operationId: PlatformGetDefaultNotificationDestinations
      parameters:
      - $ref: '#/components/parameters/platform_default_destination_type'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDefaultNotificationDestinations'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform get default notification destinations
      x-summary-source: derived
    put:
      description: Set the tenant-global default notification destinations for a type
      operationId: PlatformSetDefaultNotificationDestinations
      parameters:
      - $ref: '#/components/parameters/platform_default_destination_type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDefaultNotificationDestinationsUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDefaultNotificationDestinations'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform set default notification destinations
      x-summary-source: derived
    delete:
      description: Clear the tenant-global default notification destinations for a type
      operationId: PlatformDeleteDefaultNotificationDestinations
      parameters:
      - $ref: '#/components/parameters/platform_default_destination_type'
      responses:
        '204':
          description: Success
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform delete default notification destinations
      x-summary-source: derived
  /notifications/destinations:
    get:
      description: List all notification destinations
      operationId: PlatformListAllNotificationDestinations
      x-mcp:
        name: list_notification_destinations
        description: List the notification destinations (Slack, Microsoft Teams, email, webhook) that policies and alerts can send to.
      parameters:
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/PlatformNotificationDestinationListItem'
                    type: array
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform list all notification destinations
      x-summary-source: derived
    post:
      description: Create notification destination
      operationId: PlatformCreateNotificationDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformNotificationDestinationCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationDestination'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform create notification destination
      x-summary-source: derived
  /notifications/destinations/test:
    post:
      description: Test an unsaved notification destination
      operationId: PlatformTestUnsavedNotificationDestination
      parameters:
      - name: notification_destination_id
        in: query
        required: false
        description: Optional ID of an existing notification destination. When provided, secret headers with empty values are resolved from the existing destination's stored encrypted values, only while url matches the stored destination. This supports the editing flow where the frontend receives masked (empty) secret header values.
        schema:
          type: string
          format: uuid
        x-go-name: NotificationDestinationID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformNotificationDestinationData'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationDestinationTestResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform test unsaved notification destination
      x-summary-source: derived
  /notifications/destination/{notification_destination_id}:
    get:
      description: Get notification destination
      operationId: PlatformGetNotificationDestination
      parameters:
      - $ref: '#/components/parameters/platform_notification_destination_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationDestination'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform get notification destination
      x-summary-source: derived
    patch:
      description: Update a notification destination
      operationId: PlatformUpdateNotificationDestination
      parameters:
      - $ref: '#/components/parameters/platform_notification_destination_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformNotificationDestinationUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationDestination'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform update notification destination
      x-summary-source: derived
    delete:
      description: Delete a notification destination
      operationId: PlatformDeleteNotificationDestination
      parameters:
      - $ref: '#/components/parameters/platform_notification_destination_id'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform delete notification destination
      x-summary-source: derived
  /notifications/destination/{notification_destination_id}/test:
    post:
      description: Test a notification destination
      operationId: PlatformTestNotificationDestination
      parameters:
      - $ref: '#/components/parameters/platform_notification_destination_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationDestinationTestResponse'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '429':
          $ref: '#/components/responses/PlatformTooManyRequests'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform test notification destination
      x-summary-source: derived
  /notifications/rules/default:
    get:
      description: 'List the tenant-global default notification rules, in evaluation order. Same shape as an insight''s list; this is the tier a resource falls through to when the insight''s own list leaves it unmatched. A tenant with no global rules returns 200 with an empty `rules` list rather than 404.


        This tier supersedes `PUT /notifications/defaults/{type}` for insight alerts. While notification rules v2 is enabled for the tenant, these rules are the only routing input; the v1 default-destination rows stay readable and writable, are what the pre-v2 path uses, and have already been carried into this list by the one-time migration - so a v1 write after that point does not change v2 routing.'
      operationId: PlatformGetDefaultNotificationRules
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationRuleList'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform get default notification rules
      x-summary-source: derived
    put:
      description: 'Replace the whole tenant-global default rule list. Identical semantics to the per-insight PUT: the array index becomes `ord`, the server reconciles by rule ID, and a rule missing from the list is deleted along with its per-resource notification state. Because it is the delete mechanism for every tenant-wide default at once, it requires the same admin write access as `PUT /notifications/defaults/{type}`.


        Send the write shape, not the read shape: `ord`, `created_at` and `updated_at` are server-assigned and rejected on the way in.


        400 is returned when an unconditional rule is not last, more than one rule is unconditional, a condition type is unknown, an `app` condition''s values are not app IDs, a `tag` condition has no `key` or a non-tag condition carries one, a `destination_id` names no destination, a template is sent alongside `body_format: structured` (the structured envelope is built from the event, so the template would never be sent), a template exceeds 32 KB, a `liquid` webhook template''s sample render does not produce valid JSON, a `subject` is sent for a destination that is not email, an email row carries only one of `subject` and `template`, or a subject is over 1 KB, has a line break or does not render. 403 is an insufficient role.'
      operationId: PlatformSetDefaultNotificationRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformNotificationRuleListUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationRuleList'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform set default notification rules
      x-summary-source: derived
  /slack:
    post:
      description: Create Slack connection
      operationId: PlatformCreateSlackConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSlackConnectionCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSlackConnection'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform create slack connection
      x-summary-source: derived
  /slack/{id}/channels:
    get:
      description: List Slack channels for a connection
      operationId: PlatformListSlackChannels
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Slack connection ID
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Filter channels by name (case-insensitive partial match)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformSlackChannel'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform list slack channels
      x-summary-source: derived
  /insights/{insight_id}/notification-rules:
    get:
      description: List the notification rules for one insight, in evaluation order. Rules are first-match-wins per affected resource; a resource the list leaves unmatched - possible only when the list has no unconditional rule - continues into the tenant-global default list. An insight with no rules of its own returns 200 with an empty `rules` list rather than 404, which is also how "inherits the global default" is represented, so callers can read uniformly.
      operationId: PlatformGetInsightNotificationRules
      parameters:
      - $ref: '#/components/parameters/platform_insight_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationRuleList'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform get insight notification rules
      x-summary-source: derived
    put:
      description: 'Replace the whole rule list for one insight. The array index becomes each rule''s `ord`, so this is also the reorder call. The server reconciles by rule ID - a rule whose ID is echoed back is updated in place, one with no ID is created, and one missing from the list is deleted along with its per-resource notification state. Edits take effect at the next evaluation cycle; nothing is evaluated at save.


        Send the write shape, not the read shape: `ord`, `created_at` and `updated_at` are server-assigned and rejected on the way in, so a GET response cannot be echoed back verbatim. Strip those three and keep `id`.


        400 is returned when an unconditional rule is not last, more than one rule is unconditional, a condition type is unknown, an `app` condition''s values are not app IDs, a `tag` condition has no `key` or a non-tag condition carries one, a `destination_id` names no destination, a template is sent alongside `body_format: structured` (the structured envelope is built from the event, so the template would never be sent), a template exceeds 32 KB, a `liquid` webhook template''s sample render does not produce valid JSON, a `subject` is sent for a destination that is not email, an email row carries only one of `subject` and `template`, or a subject is over 1 KB, has a line break or does not render. 403 is an insufficient role.'
      operationId: PlatformSetInsightNotificationRules
      parameters:
      - $ref: '#/components/parameters/platform_insight_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformNotificationRuleListUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationRuleList'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Alerts
      summary: Platform set insight notification rules
      x-summary-source: derived
components:
  schemas:
    PlatformNotificationDestinationListItem:
      title: Notification Destination List Item
      type: object
      description: Notification Destination List Item
      additionalProperties: false
      required:
      - id
      - name
      - enabled
      - type
      - url
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PlatformNotificationDestinationID'
        name:
          type: string
          example: Send to Slack
        enabled:
          type: boolean
        type:
          type: string
          enum:
          - webhook
          - slack
          - msteams
          - email
          description: Type of notification destination
        url:
          type: string
          example: https://hooks.slack.com/services/REDACTED
          x-go-name: URL
        slack_channels:
          type: array
          items:
            type: string
          description: List of Slack channel names (only for slack type)
          x-go-name: SlackChannels
        last_notification_error_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last notification error
          x-go-name: LastNotificationErrorTimestamp
        last_notification_error_code:
          type: string
          nullable: true
          description: Error code of the last notification error
          x-go-name: LastNotificationErrorCode
        last_notification_error_message:
          type: string
          nullable: true
          description: Error message of the last notification error
          x-go-name: LastNotificationErrorMessage
        created_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
        updated_at:
          example: '2017-07-14T16:53:42Z'
          format: date-time
          type: string
    PlatformDefaultNotificationDestinationsUpdate:
      title: Default Notification Destinations Update
      type: object
      additionalProperties: false
      required:
      - notification_destination_ids
      properties:
        notification_destination_ids:
          type: array
          description: Destination IDs to set as the default for this type. An empty list clears the default.
          items:
            type: string
            format: uuid
    PlatformDefaultDestinationType:
      title: Default Destination Type
      type: string
      enum:
      - sync_failures
      description: The family of events a default destination set applies to. 'sync_failures' receives one message per sync run that ends failed.
    PlatformNotificationRuleDestination:
      title: Notification Rule Destination
      type: object
      description: One destination a rule delivers to, with the content to send it. Destinations are connected once and reused by any number of rules; the content lives here, on the (rule, destination) pair, because one template cannot serve both Slack text and a webhook JSON body.
      additionalProperties: false
      required:
      - destination_id
      properties:
        destination_id:
          $ref: '#/components/schemas/PlatformNotificationDestinationID'
        body_format:
          allOf:
          - $ref: '#/components/schemas/PlatformNotificationRuleBodyFormat'
          nullable: true
          description: Webhook destinations only; null for chat destinations. Omitted or null on a webhook destination means `structured`.
        template:
          type: string
          maxLength: 32768
          nullable: true
          description: 'Liquid template for the message body (chat text, or the webhook body when `body_format` is `liquid`). Null means the built-in default content: text with per-status wording for a chat destination, the structured envelope for a webhook. At most 32 KB.'
        subject:
          type: string
          maxLength: 1024
          nullable: true
          x-omitempty: true
          description: 'Email destinations only: the subject as one line of Liquid, at most 1 KB. Rendered like chat text, with line breaks in the output collapsed to spaces and the result cut at 200 characters. Set together with `template`, or leave both null for the built-in subject and body. Omitted when null.'
    PlatformNotificationRuleBodyFormat:
      title: Notification Rule Body Format
      type: string
      description: 'How a webhook body is built. `structured` sends the canonical versioned JSON envelope (`cq.notification.v1`) and is the default for new rules; `liquid` renders the row''s `template`, JSON-escaping every interpolation. Either body is sent with `Content-Type: application/json` unless the destination''s own headers set one. Chat destinations (Slack, Teams) never set it - their content is always the rendered `template`.'
      enum:
      - structured
      - liquid
    PlatformNotificationRuleTagCondition:
      title: Notification Rule Tag Condition
      type: object
      description: A condition on one resource tag. The only condition type that carries a `key`. A tag `env:prod` and an inferred environment `prod` are deliberately distinct condition types.
      additionalProperties: false
      required:
      - type
      - key
      - values
      properties:
        type:
          type: string
          enum:
          - tag
        key:
          type: string
          minLength: 1
          maxLength: 128
          description: The tag key to read. At most 128 characters.
        values:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
          description: Tag values to match, any-of. Between 1 and 50 per condition.
    PlatformNotificationDestination:
      title: Notification Destination
      type: object
      description: Notification Destination
      additionalProperties: false
      required:
      - id
      - name
      - enabled
      - type
      - url
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PlatformNotificationDestinationID'
        name:
          type: string
          example: Send to Slack
        enabled:
          type: boolean
        type:
          type: string
          enum:
          - webhook
          - slack
          - msteams
          - email
          description: Type of notification destination
        url:
          type: string
          example: https://hooks.slack.com/services/REDACTED
          x-go-name: URL
        http_headers:
          type: object
          additionalProperties:
            type: string
          x-go-name: HTTPHeaders
          x-go-type-skip-optional-pointer: true
        http_secret_headers:
          type: object
          additionalProperties:
            type: string
          description: Secret HTTP headers. Keys are visible but values are always returned as empty strings. The actual values are encrypted at rest.
          x-go-name: HTTPSecretHeaders
          x-go-type-skip-optional-pointer: true
        slack_connection_id:
          type: string
          format: uuid
          nullable: true
          description: Slack connection ID (only for slack type)
          x-go-name: SlackConnectionID
        slack_channels:
          type: array
          items:
            type: string
          description: List of Slack channel IDs (only for slack type)
          x-go-name: SlackChannels
        email_recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 254
          description: The addresses an email destination sends to, lower-cased and deduplicated (only for email type; omitted for other types). Each address receives its own copy.
        msteams_webhook_url:
          type: string
          description: Microsoft Teams Power Automate Workflow URL (only for msteams type). The actual URL is encrypted at rest and never returned. For msteams destinations the field is emitted as the empty string ("") so clients can detect that the value exists without ever seeing it; for non-msteams destinations the field is omitted from the response entirely.
          x-go-name: MSTeamsWebhookURL
        webhook_signing_secret:
          type: string
          description: 'HMAC-SHA256 secret used to sign webhook deliveries (only for webhook type). Write-only: emitted as the empty string ("") when a secret is stored and omitted when none is. Deliveries carry `X-CloudQuery-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, t + "." + body)>`.'
