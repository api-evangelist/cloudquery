        outcome:
          type: string
          enum:
          - deliver
          - suppress
        destinations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlatformNotificationRuleDestination'
        ord:
          type: integer
          description: Evaluation position, ascending. Assigned from the PUT array index, so it is 0..n over the returned list.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformSlackChannel:
