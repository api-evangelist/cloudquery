          x-go-name: SlackChannels
        custom_message:
          type: string
          maxLength: 0
          deprecated: true
          description: 'Deprecated: must be empty or omitted. A notification rule carries the message content.'
          x-go-name: CustomMessage
        email_recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 254
          description: 1 to 20 addresses (required for email type, must not be set for other types). Addresses are trimmed, lower-cased and deduplicated; each receives its own copy.
        msteams_webhook_url:
          type: string
          example: https://prod-12.westus.logic.azure.com:443/workflows/abc/triggers/manual/paths/invoke?api-version=2016-06-01
          description: Microsoft Teams Power Automate Workflow URL (required for msteams type, must not be set for webhook/slack). Accepts either the legacy Logic Apps direct form (*.logic.azure.{com,us,cn}/workflows/.../triggers/...) or the newer Power Platform API gateway form (*.environment.api.powerplatform.{com,us,cn}/powerautomate/automations/direct/workflows/.../triggers/...). Deprecated outlook.office.com Office 365 Connector URLs (retired April 2026) are rejected. When testing an existing destination, send an empty string together with the notification_destination_id query parameter to reuse the stored encrypted URL (the GET response masks this field to "").
          x-go-name: MSTeamsWebhookURL
        url:
          type: string
          example: https://hooks.slack.com/services/REDACTED
          description: Webhook URL (required for webhook type, must not be set for slack type)
          x-go-name: URL
        http_headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers (required for webhook type, must not be set for slack type). User-Agent and X-CloudQuery-Signature are reserved for CloudQuery and rejected in any casing.
          x-go-name: HTTPHeaders
          x-go-type-skip-optional-pointer: true
        http_secret_headers:
          type: object
          additionalProperties:
            type: string
          description: Secret HTTP headers with encrypted values. Values are encrypted at rest and returned as empty strings in responses. For updates, send empty string to keep existing value, or new value to replace. Must not be set for slack type. When testing an existing destination, send an empty string together with the notification_destination_id query parameter to reuse the stored value; reuse is allowed only while url matches the stored destination. User-Agent and X-CloudQuery-Signature are reserved for CloudQuery and rejected in any casing.
          x-go-name: HTTPSecretHeaders
          x-go-type-skip-optional-pointer: true
        webhook_signing_secret:
          type: string
          description: HMAC-SHA256 secret used to sign webhook deliveries (only for webhook type, must not be set for slack or msteams). At least 16 characters. Stored encrypted and never returned. When testing an existing destination, send an empty string together with the notification_destination_id query parameter to reuse the stored secret; reuse is allowed only while url matches the stored destination.
          x-go-name: WebhookSigningSecret
        http_body:
          type: string
          maxLength: 0
