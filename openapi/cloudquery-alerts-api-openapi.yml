        msteams_webhook_url:
          type: string
          description: Microsoft Teams Power Automate Workflow URL (only for msteams type, must not be set for webhook/slack). Accepts either the legacy Logic Apps direct form (*.logic.azure.{com,us,cn}/workflows/.../triggers/...) or the newer Power Platform API gateway form (*.environment.api.powerplatform.{com,us,cn}/powerautomate/automations/direct/workflows/.../triggers/...). Deprecated outlook.office.com Office 365 Connector URLs (retired April 2026) are rejected. To keep the existing encrypted value, either omit the field or send the empty string — the GET response masks this field to "" so frontends that re-submit the form blindly will not accidentally rotate the URL.
