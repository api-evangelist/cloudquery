    PlatformInsightSilenceList:
      title: Insight Silence List
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSilence'
    PlatformInsightSilenceResourceSelection:
      title: Insight Silence Resource Selection
      type: object
      description: Resources to silence. Provide exactly one of resource_ids (a fixed selection, scope=resource) or filter (a stored, dynamically-evaluated asset filter, scope=filter) — the two are mutually exclusive.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        resource_ids:
          type: array
          items:
            type: string
          description: Explicit resource identifiers (_cq_platform_id) to silence (scope=resource).
        filter:
          $ref: '#/components/schemas/PlatformInsightSilenceResourceFilter'
    PlatformInsightSilenceID:
      description: The unique ID for the insight silence
      type: string
      format: uuid
      x-go-name: InsightSilenceID
    PlatformInsightSilenceScope:
      description: Scope of a silence. insight suppresses the whole insight (including resources from future syncs); resource suppresses a fixed set of selected resources; filter suppresses resources matching a stored asset filter, re-evaluated on every read (so resources appearing later are covered).
      type: string
      enum:
      - insight
      - resource
      - filter
      x-go-name: InsightSilenceScope
    PlatformInsight:
