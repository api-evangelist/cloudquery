        - region
        - account
        - resource-type
        - instance-type
        - tag
      x-go-name: InsightAssetColumnName
    platform_per_page:
      description: The number of results per page (max 1000).
      in: query
      name: per_page
      required: false
      schema:
        default: 100
        maximum: 1000
        minimum: 1
        type: integer
        format: int64
    platform_insight_id:
      in: path
      name: insight_id
      required: true
      schema:
        $ref: '#/components/schemas/PlatformInsightID'
      x-go-name: InsightID
  schemas:
    PlatformSilencedInsight:
      title: Silenced Insight
