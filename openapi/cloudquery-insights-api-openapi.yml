          type: integer
          format: int64
          description: Currently-present resources covered by the silence.
    PlatformInsightFilter:
      title: Insight Filter
      type: object
      description: Saved insight filter details
      additionalProperties: false
      required:
      - id
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 12345678-1234-1234-1234-1234567890ab
        name:
          type: string
          example: My Saved Security Filter
        description:
          type: string
          example: Filters for critical security insights in AWS
        search:
          type: string
          example: s3 bucket
        insight_category:
          type: array
          items:
            type: string
          example:
          - Security
          - Compliance
        severities:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSeverity'
          example:
          - Critical
          - High
        resource_types:
          type: array
          items:
            type: string
          example:
          - aws_s3_bucket
          - aws_ec2_instance
        source:
          type: array
          items:
            type: string
          example:
          - Platform
          - Wiz
        source_category:
          type: array
          items:
            type: string
          example:
          - Platform
          - Third Party
        clouds:
          type: array
          items:
            type: string
          example:
          - aws
          - azure
        accounts:
          type: array
          items:
            type: string
          example:
          - prod-account
          - staging-account
        regions:
          type: array
          items:
            type: string
          example:
          - us-east-1
          - eu-west-1
        tags:
          type: array
          items:
            type: string
          example:
          - production
          - critical
        ownership_tags:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Ownership tag filters keyed by tag name
          example:
            team:
            - engineering
            - platform
            org:
            - cloud
        group_by:
          type: array
          items:
            type: string
          example:
          - severity
        user_id:
          $ref: '#/components/schemas/PlatformUserID'
        created_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
        updated_at:
          type: string
          format: date-time
          example: '2017-07-14T16:53:42Z'
    PlatformInsightAppCount:
      title: InsightAppCount
      type: object
      description: Per-app rollup of insights — how many insights and affected assets belong to an app.
      additionalProperties: false
      required:
      - app_id
      - app_name
      - insight_count
      - resources_count
      properties:
        app_id:
          type: string
          format: uuid
          description: The app's unique ID.
          x-go-name: AppID
        app_name:
          type: string
          description: Display name for the app (title when set, otherwise the canonical name).
        insight_count:
          type: integer
          format: int64
          description: Number of distinct insights affecting assets that belong to this app.
        resources_count:
          type: integer
          format: int64
          description: Number of distinct affected assets belonging to this app.
        silenced_resource_count:
          type: integer
          format: int64
          description: Number of this app's affected resources that are hidden by active silences (total resources minus those surviving the silence exclusion).
        cost_last_30_days:
          type: number
          format: double
          description: Summed 30-day unblended cost across the app's affected assets. Present only when at least one contributing asset carries cost data.
