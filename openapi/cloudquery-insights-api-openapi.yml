openapi: 3.2.0
info:
  contact:
    email: support@cloudquery.io
    name: CloudQuery Support Team
    url: https://cloudquery.io
  description: 'Welcome to the CloudQuery Platform API documentation! This API can be used to interact with the CloudQuery platform. As a user, the API allows you to search the CloudQuery asset inventory, run SQL queries against the data warehouse, save and load searches, and much more. As an administrator, it allows you to manage your teams, syncs, and other objects.

    ### Authentication

    The API is secured using bearer tokens. To get started, you can generate an API key for your Platform deployment from your platform dashboard. For a step-by-step guide, see: https://www.cloudquery.io/docs/cli/managing-cloudquery/deployments/generate-api-key.

    The base URL for the API depends on where your CloudQuery Platform is hosted. If running locally, this is usually http://localhost:3000/api. In a production deployment it should be an HTTPS URL. For purposes of illustration, we will assume the platform instance is available at https://cloudquery.mycompany.com. In this case, the base API endpoint will be https://cloudquery.mycompany.com/api.

    ### Example Request

    To test your connection to the API, we can use the `/plugins` endpoint. For example:

    `curl -v -H "Authorization: Bearer $CLOUDQUERY_API_KEY" \ https://cloudquery.mycompany.com/api/plugins`'
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://www.cloudquery.io/terms
  title: CloudQuery Platform OpenAPI Spec Insights API
  version: 1.0.0
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: Insights
paths:
  /insights:
    get:
      description: List insights with optional filtering
      operationId: PlatformListPlatformInsights
      x-mcp:
        name: list_insights
        description: List security, cost and compliance findings across the inventory. Filter by severities, cloud, account, region, source, resource_types or insight_category; use search for free text. Each item carries an insight_id for get_insight and list_insight_assets. The same findings are queryable as the insights and insight_resources tables through run_query when you need a join.
      parameters:
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_per_page'
      - name: silenced
        in: query
        required: false
        schema:
          type: boolean
        description: When true, return only insights that have at least one active silence. Omit (or false) for the default active view, which hides silenced insights and resources.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search in title, evidence (description), mitigation, or related fields
      - name: severities
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSeverity'
        style: form
        explode: true
        description: Filter by severities (any match)
      - name: cloud
        in: query
        required: false
        schema:
          type: string
        description: Filter by cloud
      - name: account
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by account (repeat for multiple values, OR)
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Filter by region
      - name: insight_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by insight category (repeat for multiple values, OR)
      - name: source_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source category (repeat for multiple values, OR)
      - name: source
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source (repeat for multiple values, OR)
      - name: resource_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by resource types
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by tags (any match)
      - name: app_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter to insights whose underlying asset is a member of this app. Membership is read from the materialized app_memberships graph.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - title
          - severity
          - insight_category
          - source_category
          - account
          - source
          - resource_types
          - resources_count
          - accounts_count
          - created_at
          - detected_at
          - cost_last_7_days
          - cost_last_30_days
          default: detected_at
        description: Field to sort by
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformInsight'
                  metadata:
                    $ref: '#/components/schemas/PlatformInsightsListMetadata'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform list platform insights
      x-summary-source: derived
  /insights/columns/{column_name}/distinct-values:
    get:
      description: 'Get the candidate values for the next filter dimension (`column_name`), given the current active filters. The supplied filter parameters represent where the user currently is in the filter matrix; only values for `column_name` that would yield at least one insight when added to that current position are returned. Values that would produce zero results are omitted, preventing the user from navigating to an empty state.

        The filter parameter corresponding to `column_name` is always ignored when computing candidates — asking "which severities exist where severity=X" is self-referential and nonsensical. For example, if `column_name=severity` then any `severities` filter in the request is not applied; if `column_name=source` then any `source` filter is not applied; and so on. This ensures the full set of viable values for that dimension is always returned given the other active filters.

        When `owner_tag` is specified (e.g., "team", "department"), this endpoint returns distinct values for that specific ownership tag key, ignoring the `column_name` parameter. The corresponding tags filter for this owner key is ignored to prevent self-referential queries.

        When querying for `column_name=tag` without `owner_tag`, ownership tags configured in platform settings are automatically excluded from results.'
      operationId: PlatformGetPlatformInsightColumnDistinctValues
      parameters:
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_insight_column_name'
      - name: owner_tag
        in: query
        required: false
        schema:
          type: string
        description: When specified, returns distinct values for this ownership tag key (e.g., "team", "department"). The column_name parameter is ignored when owner_tag is provided.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search in title, evidence (description), mitigation, or related fields
      - name: severities
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSeverity'
        style: form
        explode: true
        description: Filter by severities (any match)
      - name: cloud
        in: query
        required: false
        schema:
          type: string
        description: Filter by cloud
      - name: account
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by account (repeat for multiple values, OR)
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Filter by region
      - name: insight_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by insight category (repeat for multiple values, OR)
      - name: source_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source category (repeat for multiple values, OR)
      - name: source
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source (repeat for multiple values, OR)
      - name: resource_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by resource types
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by tags (any match)
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - values
                properties:
                  values:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform get platform insight column distinct values
      x-summary-source: derived
  /insights/saved-filters:
    get:
      description: List saved insight filters
      operationId: PlatformListInsightFilters
      parameters:
      - $ref: '#/components/parameters/platform_per_page'
      - $ref: '#/components/parameters/platform_page'
      - name: search_term
        in: query
        required: false
        schema:
          type: string
        description: Search in filter name or description
      - name: insight_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by insight category
      - name: severities
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSeverity'
        style: form
        explode: true
        description: Filter by severities (any match)
      - name: resource_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by resource types
      - name: source
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source
      - name: source_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source category
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by tags (any match)
      - name: group_by
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by group by fields
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformInsightFilter'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform list insight filters
      x-summary-source: derived
    post:
      description: Create a new saved insight filter
      operationId: PlatformCreateInsightFilter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformInsightFilterCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsightFilter'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform create insight filter
      x-summary-source: derived
  /insights/saved-filters/{insight_filter_id}:
    get:
      description: Get a saved insight filter by ID
      operationId: PlatformGetInsightFilterByID
      parameters:
      - $ref: '#/components/parameters/platform_insight_filter_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsightFilter'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform get insight filter by ID
      x-summary-source: derived
    patch:
      description: Update a saved insight filter
      operationId: PlatformUpdateInsightFilter
      parameters:
      - $ref: '#/components/parameters/platform_insight_filter_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformInsightFilterUpdate'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsightFilter'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform update insight filter
      x-summary-source: derived
    delete:
      description: Delete a saved insight filter
      operationId: PlatformDeleteInsightFilter
      parameters:
      - $ref: '#/components/parameters/platform_insight_filter_id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform delete insight filter
      x-summary-source: derived
  /insights/silences:
    get:
      description: List insight silence records. Returns the raw active silences for the tenant, optionally filtered to a single insight. Unlike GET /insights/silenced (which aggregates fully-hidden insights), this returns every silence record, including resource-level silences that only partially cover an insight.
      operationId: PlatformListInsightSilences
      parameters:
      - name: insight_id
        in: query
        required: false
        schema:
          type: string
        description: Restrict results to silences for this insight.
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsightSilenceList'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform list insight silences
      x-summary-source: derived
    post:
      description: Silence one or more insights
      operationId: PlatformSilenceInsights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformInsightSilenceCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsightSilenceList'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '422':
          $ref: '#/components/responses/PlatformUnprocessableEntity'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform silence insights
      x-summary-source: derived
    delete:
      description: 'Delete insight silences. The request body must set exactly one of insight_silence_ids (delete those specific records) or insight_ids (delete every active silence for those insights). Idempotent: returns 204 even when some or all of the referenced silences do not exist.'
      operationId: PlatformDeleteInsightSilences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformInsightSilenceDelete'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform delete insight silences
      x-summary-source: derived
  /insights/silenced:
    get:
      description: List silenced insights with their silence metadata
      operationId: PlatformListSilencedInsights
      parameters:
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_per_page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformSilencedInsight'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform list silenced insights
      x-summary-source: derived
  /insights/by-app:
    get:
      description: Group insights by the app their underlying assets belong to, returning a per-app count of insights and affected assets (and summed 30-day cost). Answers questions like "list apps by count of security findings" that the per-insight list endpoint cannot express. Only assets that are members of some app contribute; the standard insight filters narrow which insights are counted.
      operationId: PlatformListPlatformInsightsByApp
      x-mcp:
        name: insights_by_app
        description: Count findings and affected assets per app, with summed 30-day cost. Answers "which apps have the most security findings". Only assets that belong to an app are counted; the standard insight filters apply.
      parameters:
      - $ref: '#/components/parameters/platform_page'
      - $ref: '#/components/parameters/platform_per_page'
      - name: silenced
        in: query
        required: false
        schema:
          type: boolean
        description: When true, return only apps whose insights have at least one active silence. Omit (or false) for the default active view.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search in title, evidence (description), mitigation, or related fields
      - name: severities
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInsightSeverity'
        style: form
        explode: true
        description: Filter by severities (any match)
      - name: cloud
        in: query
        required: false
        schema:
          type: string
        description: Filter by cloud
      - name: account
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by account (repeat for multiple values, OR)
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Filter by region
      - name: insight_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by insight category (repeat for multiple values, OR)
      - name: source_category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source category (repeat for multiple values, OR)
      - name: source
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by source (repeat for multiple values, OR)
      - name: resource_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by resource types
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by tags (any match)
      responses:
        '200':
          description: Per-app insight counts, ordered by insight count descending.
          content:
            application/json:
              schema:
                required:
                - items
                - metadata
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformInsightAppCount'
                  metadata:
                    $ref: '#/components/schemas/PlatformListMetadata'
        '400':
          $ref: '#/components/responses/PlatformBadRequest'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform list platform insights by app
      x-summary-source: derived
  /insights/{insight_id}:
    get:
      description: Get insight by ID
      operationId: PlatformGetPlatformInsight
      x-mcp:
        name: get_insight
        description: 'Get one finding by insight_id: title, severity, evidence, mitigation, affected-asset count and cost. Use after list_insights when the summary row is not enough.'
      parameters:
      - $ref: '#/components/parameters/platform_insight_id'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search in asset name, account, region, etc.
      - name: accounts
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by account IDs
      - name: clouds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by cloud providers (e.g. aws, azure, gcp, github, backstage, digitalocean, wiz)
      - name: regions
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by regions
      - name: resource_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by resource type
      - name: instance_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by instance type (from additional_properties.instance_type, e.g. EC2 instance class)
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by tags (key:value strings; all pairs must match)
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInsight'
        '401':
          $ref: '#/components/responses/PlatformRequiresAuthentication'
        '403':
          $ref: '#/components/responses/PlatformForbidden'
        '404':
          $ref: '#/components/responses/PlatformNotFound'
        '500':
          $ref: '#/components/responses/PlatformInternalError'
      tags:
      - Insights
      summary: Platform get platform insight
      x-summary-source: derived
  /insights/{insight_id}/assets:
    get:
      description: List assets affected by an insight
      operationId: PlatformGetPlatformInsightAssets
      x-mcp:
        name: list_insight_assets
