components:
  parameters:
    platform_insight_column_name:
      in: path
      name: column_name
      required: true
      description: Column for distinct values. Can be a standard column (severity, insight-category, source-category, source, resource-type, account, tag) or an arbitrary owner tag key when is_owner=true.
      schema:
