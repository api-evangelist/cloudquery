aid: cloudquery
name: CloudQuery
description: >-
  CloudQuery is a cloud infrastructure data platform that gives platform
  engineering and cloud operations teams a queryable SQL data layer for
  visibility, governance, and automation. It syncs configuration data from
  AWS, GCP, Azure, and 70+ SaaS sources into normalized tables, powering
  cloud asset inventory, security and compliance monitoring, and FinOps
  use cases. CloudQuery exposes Platform REST APIs for managing tenants,
  syncs, destinations, and API keys, authenticated via API key.
type: Index
